name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and frontend build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2

      # rust-toolchain.toml pins a minimal profile, which leaves rustfmt and
      # clippy out; the checks below need both.
      - name: Rust toolchain components
        run: rustup component add rustfmt clippy

      # WebKitGTK and friends are what compiling the shell needs on Linux.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install JS dependencies
        run: npm ci --prefix apps/desktop

      # Formatting is checked everywhere because it costs no compile.
      - name: Check the Rust formatting
        run: cargo fmt --all --check

      - name: Build the front end
        run: npm run build --prefix apps/desktop

      - name: Test the front end
        run: npm test --prefix apps/desktop

      - name: Test the Rust workspace
        run: cargo test --workspace

      # Clippy compiles the whole workspace including the shell, so it runs once,
      # after the front end exists — the shell's build script reads dist/.
      - name: Lint the Rust workspace
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
